
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <title>Agentic Frontend and 3D Web Playbook</title>
  <desc>Horizontal brand logo with a geometric 3D cube and frontend code-inspired symbol.</desc>

  <g transform="translate(180 270)">
    <!-- Outer code brackets -->
    <path d="M105 65 L55 110 L105 155"
          stroke="#64748B" stroke-width="15"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M335 65 L385 110 L335 155"
          stroke="#64748B" stroke-width="15"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Geometric 3D cube -->
    <path d="M220 25 L305 73 L220 121 L135 73 Z"
          stroke="#06B6D4" stroke-width="12"
          stroke-linejoin="round"/>
    <path d="M135 73 V170 L220 220 V121"
          stroke="#94A3B8" stroke-width="12"
          stroke-linejoin="round"/>
    <path d="M305 73 V170 L220 220"
          stroke="#64748B" stroke-width="12"
          stroke-linejoin="round"/>

    <!-- AI connection node -->
    <circle cx="305" cy="25" r="13" fill="#06B6D4"/>
    <path d="M305 38 V60" stroke="#06B6D4" stroke-width="8"
          stroke-linecap="round"/>
    <circle cx="220" cy="25" r="7" fill="#E2E8F0"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, Arial, Helvetica, sans-serif">
    <text x="650" y="390" fill="#E2E8F0"
          font-size="86" font-weight="700"
          letter-spacing="-3">
      Agentic Frontend
    </text>

    <text x="655" y="475" fill="#06B6D4"
          font-size="43" font-weight="500"
          letter-spacing="2">
      &amp; 3D WEB PLAYBOOK
    </text>

    <path d="M655 525 H1180"
          stroke="#334155" stroke-width="3"/>

    <text x="655" y="575" fill="#94A3B8"
          font-size="23" font-weight="400"
          letter-spacing="3">
      ENGINEERING · CREATIVITY · INTELLIGENCE
    </text>
  </g>
</svg>
